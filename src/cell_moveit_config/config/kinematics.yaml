# This is the inverse kinematics setup for the arm group, KDL's numerical solver over the chain
# from base_link to tcp. move_group uses it for the pose goals the skills plan to, searching
# within the URDF's joint ranges.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05  # s per solve
