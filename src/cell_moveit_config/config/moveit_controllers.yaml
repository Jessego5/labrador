# These are the controllers move_group executes trajectories through, the same ones
# sim.launch.py spawns from cell_description/config/ros2_controllers.yaml:
# joint_trajectory_controller for the six arm joints and gripper_controller, a
# parallel_gripper_action_controller commanded on robotiq_85_left_knuckle_joint in radians
# (0 open, 0.8 closed). The admittance controller is not listed; the skills switch it in
# themselves.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
    - gripper_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  gripper_controller:
    type: ParallelGripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - robotiq_85_left_knuckle_joint

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.02
