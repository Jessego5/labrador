# These are the mujoco_ros2_control plugins that ros2_control_node loads next to the robot
# hardware interface: a publisher of the ground-truth poses of the free bodies, and the overhead
# camera. The camera is the expensive one, since rendering in the VM is software GL (llvmpipe),
# so it renders only when asked.
/**:
  ros__parameters:
    mujoco_plugins:
      # ground-truth poses of every free body (the objects), used to score runs, and in part 3 as a
      # stand-in for perception
      free_joint_state_publisher:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
        frame_id: ""   # a MuJoCo body name; empty means the MuJoCo world, which is the table frame
        publish_rate: 50.0
      # The overhead camera, rendered only on request through its trigger service, because
      # software rendering is slow. Perception triggers one frame per detection.
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 2.0
        overhead:
          policy: polled
          frame_name: overhead_camera_optical_frame
          info_topic: /camera/camera_info
          image_topic: /camera/image_raw
          depth_topic: /camera/depth
