# These are the objects in the cell, and three things read this file.
# scripts/build_objects_mjcf.py turns it into mjcf/objects.xml, the MuJoCo bodies at their
# default poses; cell_perception takes `types` as the list of what the detector can recognise,
# by colour, shape and size; and cell_benchmarks takes the instance names, the sizes and the
# randomisation rules. Regenerate the MJCF after editing, with
# python3 scripts/build_objects_mjcf.py.

# object types; size is the bounding box [x, y, z] in m, [diameter, diameter, height] for
# cylinders
types:
  red_cube:      {class: cube,     shape: box,      color: red,    size: [0.040, 0.040, 0.040], rgba: [0.85, 0.10, 0.10, 1]}
  green_cube:    {class: cube,     shape: box,      color: green,  size: [0.040, 0.040, 0.040], rgba: [0.10, 0.70, 0.20, 1]}
  blue_cylinder: {class: cylinder, shape: cylinder, color: blue,   size: [0.030, 0.030, 0.050], rgba: [0.10, 0.30, 0.85, 1]}
  yellow_peg:    {class: peg,      shape: cylinder, color: yellow, size: [0.020, 0.020, 0.070], rgba: [0.90, 0.80, 0.10, 1]}

# instances and their default start poses [x, y, yaw] in the table frame, resting on the table
objects:
  cube_red_0:   {type: red_cube,      pose: [0.40,  0.15, 0.0]}
  cube_red_1:   {type: red_cube,      pose: [0.30, -0.20, 0.0]}
  cube_green_0: {type: green_cube,    pose: [0.55, -0.25, 0.0]}
  cyl_blue_0:   {type: blue_cylinder, pose: [0.30, -0.05, 0.0]}
  cyl_blue_1:   {type: blue_cylinder, pose: [0.62,  0.20, 0.0]}
  cyl_blue_2:   {type: blue_cylinder, pose: [0.70, -0.15, 0.0]}
  cyl_blue_3:   {type: blue_cylinder, pose: [0.40, -0.30, 0.0]}
  peg_0:        {type: yellow_peg,    pose: [0.25,  0.05, 0.0]}

# Randomised start poses, for cell_benchmarks. Object centres are sampled uniformly in `region`,
# within `reach` of the robot base, at least `min_spacing` apart (room for the open fingers) and
# at least `keepout_margin` outside every tray, bin and fixture footprint.
randomize:
  region: {x: [0.22, 0.75], y: [-0.42, 0.42]}
  reach: [0.25, 0.70]
  min_spacing: 0.10
  keepout_margin: 0.06
