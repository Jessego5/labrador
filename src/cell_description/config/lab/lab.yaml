# This is the lab scene's samples and the chemistry they follow, the one file three things read.
# build_lab_mjcf.py makes a MuJoCo body for every look a sample can have (its visual twins), all
# parked on the floor under the table; cell_lab runs the chemistry, keeping each sample's true
# state and swapping the twin that shows it into the sample's place; and cell_perception reads
# `types` to know what it can recognise, exactly as it reads config/objects.yaml in the default
# scene. Twins exist because MuJoCo cannot recolour a body while it runs, and the robot has to
# see a change rather than be told about it: nothing on the robot's side reads this file's
# chemistry. A twin's body and free joint are named <sample>__<look>, e.g. assay_1__vial_green.
# Regenerate the MJCF with python3 scripts/build_lab_mjcf.py after editing.

# What the samples can look like, in config/objects.yaml's format. All vials are 30 mm across and
# 50 mm tall, the size of the cylinders the gripper already handles; only the colour differs. The
# colours were chosen on the rendered image: a pink tried first came out at hue 133 to 150 on the
# overexposed top face, inside purple's 125 to 138, so a finished assay shows green instead.
types:
  vial_blue:   {class: vial, shape: cylinder, color: blue,   size: [0.030, 0.030, 0.050], rgba: [0.10, 0.30, 0.85, 1]}
  vial_green:  {class: vial, shape: cylinder, color: green,  size: [0.030, 0.030, 0.050], rgba: [0.15, 0.70, 0.25, 1]}
  vial_brown:  {class: vial, shape: cylinder, color: brown,  size: [0.030, 0.030, 0.050], rgba: [0.40, 0.22, 0.08, 1]}
  vial_yellow: {class: vial, shape: cylinder, color: yellow, size: [0.030, 0.030, 0.050], rgba: [0.90, 0.80, 0.10, 1]}
  vial_orange: {class: vial, shape: cylinder, color: orange, size: [0.030, 0.030, 0.050], rgba: [0.95, 0.50, 0.05, 1]}
  vial_red:    {class: vial, shape: cylinder, color: red,    size: [0.030, 0.030, 0.050], rgba: [0.85, 0.10, 0.10, 1]}
  vial_purple: {class: vial, shape: cylinder, color: purple, size: [0.030, 0.030, 0.050], rgba: [0.45, 0.15, 0.70, 1]}

  # Test tubes for the readout, the vial's size again. An indicator scale from yellow-olive
  # (negative) to teal (positive), kept dark enough that the light does not wash it out, so the
  # rendered hue is the material's: 60, 82, 108, 142 and 176 degrees. The two greenest are
  # darker still (top V about 175), because the camera noise lifted them over the readout
  # colour's value cap of 205 in up to 4% of single frames. perceive: false keeps the
  # five looks out of the detector, which sees them all as one `tube` type of colour `readout`
  # and reports each one's measured hue; telling them apart is the task's job.
  tube:            {class: tube, shape: cylinder, color: readout, size: [0.030, 0.030, 0.050]}
  tube_neg_strong: {class: tube, shape: cylinder, color: readout, size: [0.030, 0.030, 0.050], rgba: [0.45, 0.45, 0.05, 1], perceive: false}
  tube_neg_weak:   {class: tube, shape: cylinder, color: readout, size: [0.030, 0.030, 0.050], rgba: [0.30, 0.45, 0.05, 1], perceive: false}
  tube_borderline: {class: tube, shape: cylinder, color: readout, size: [0.030, 0.030, 0.050], rgba: [0.1425, 0.4275, 0.076, 1], perceive: false}
  tube_pos_weak:   {class: tube, shape: cylinder, color: readout, size: [0.030, 0.030, 0.050], rgba: [0.045, 0.405, 0.18, 1], perceive: false}
  tube_pos_strong: {class: tube, shape: cylinder, color: readout, size: [0.030, 0.030, 0.050], rgba: [0.05, 0.40, 0.38, 1], perceive: false}

  # Culture dishes for the growth experiment: a magenta dish 56 mm across and 25 mm deep, deep
  # enough for the fingers to hold above the table, with a cream colony disc on top that grows
  # through five stages (radius 4, 8, 12, 15 and 18 mm, 50 to 1018 mm^2). The detector sees one
  # `dish` type and measures the yellow inside its outline as the colony's area.
  dish:   {class: dish, shape: cylinder, color: magenta, size: [0.056, 0.056, 0.025], inner_color: yellow}
  dish_0: {class: dish, shape: cylinder, color: magenta, size: [0.056, 0.056, 0.025], rgba: [0.55, 0.08, 0.42, 1], colony: {radius: 0.004, rgba: [0.95, 0.85, 0.20, 1]}, perceive: false}
  dish_1: {class: dish, shape: cylinder, color: magenta, size: [0.056, 0.056, 0.025], rgba: [0.55, 0.08, 0.42, 1], colony: {radius: 0.008, rgba: [0.95, 0.85, 0.20, 1]}, perceive: false}
  dish_2: {class: dish, shape: cylinder, color: magenta, size: [0.056, 0.056, 0.025], rgba: [0.55, 0.08, 0.42, 1], colony: {radius: 0.012, rgba: [0.95, 0.85, 0.20, 1]}, perceive: false}
  dish_3: {class: dish, shape: cylinder, color: magenta, size: [0.056, 0.056, 0.025], rgba: [0.55, 0.08, 0.42, 1], colony: {radius: 0.015, rgba: [0.95, 0.85, 0.20, 1]}, perceive: false}
  dish_4: {class: dish, shape: cylinder, color: magenta, size: [0.056, 0.056, 0.025], rgba: [0.55, 0.08, 0.42, 1], colony: {radius: 0.018, rgba: [0.95, 0.85, 0.20, 1]}, perceive: false}

protocols:
  # A colour-change assay. Every vial starts blue and, after a reaction time drawn per vial,
  # turns green when the reaction worked or brown when it failed. Times are in simulation seconds.
  assay:
    looks: {start: vial_blue, done: vial_green, failed: vial_brown}
    reaction_time: [20.0, 90.0]
    failure_rate: 0.25
    samples: {assay_1: rack_in/A1, assay_2: rack_in/A2, assay_3: rack_in/A3, assay_4: rack_in/A4}

  # A titration. Each dose moves a vial along the colour scale, but how many doses each step takes
  # is drawn per vial, so the robot has to look after every dose. red is the endpoint and purple
  # is one dose too many. A dose shows after mix_time, as an indicator takes a moment to turn.
  titration:
    looks: [vial_yellow, vial_orange, vial_red, vial_purple]
    endpoint: 2
    doses_per_stage: [1, 3]
    mix_time: 1.5
    samples: {titr_1: rack_in/B1, titr_2: rack_in/B2}

  # A growth experiment. Each dish's colony grows one stage after a time drawn per stage; the
  # robot should harvest a dish once its colony covers harvest_area and not before. Samples
  # start on the table at [x, y], not in a rack, since a dish is too wide for the racks.
  growth:
    looks: [dish_0, dish_1, dish_2, dish_3, dish_4]
    stage_time: [15.0, 35.0]
    harvest_area: 0.0006
    samples: {plate_1: [0.58, 0.12], plate_2: [0.58, 0.24], plate_3: [0.58, 0.36]}

  # A test readout. Each tube shows one point of the indicator scale, drawn per tube; truth says
  # what each point means, and a borderline tube cannot be called either way. Nothing changes
  # during the run: the difficulty is reading, not waiting.
  readout:
    looks: [tube_neg_strong, tube_neg_weak, tube_borderline, tube_pos_weak, tube_pos_strong]
    truth: {tube_neg_strong: negative, tube_neg_weak: negative, tube_borderline: borderline,
            tube_pos_weak: positive, tube_pos_strong: positive}
    samples: {tube_1: rack_in/A1, tube_2: rack_in/A2, tube_3: rack_in/A3, tube_4: rack_in/A4}

# Where the twins wait while they are not shown: a grid on the floor under the table top, which
# hides them from the overhead camera. The floor is the plane in the scene at z = -0.75.
parking: {x: [0.0, 0.66], y: [-0.5, 0.5], pitch: 0.06, floor: -0.75}
